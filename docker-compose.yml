name: aimed-jobseek

services:
  postgres:
    image: postgres:16-alpine
    container_name: aimed-jobseek-postgres
    environment:
      POSTGRES_USER: aimedjobseek
      POSTGRES_PASSWORD: aimedjobseek
      POSTGRES_DB: aimedjobseek
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimedjobseek -d aimedjobseek"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - aimedjobseek-pg:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    container_name: aimed-jobseek-postgres-test
    environment:
      POSTGRES_USER: aimedjobseek_test
      POSTGRES_PASSWORD: aimedjobseek_test
      POSTGRES_DB: aimedjobseek_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimedjobseek_test -d aimedjobseek_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - aimedjobseek-test-pg:/var/lib/postgresql/data

volumes:
  aimedjobseek-pg:
    name: aimedjobseek-pg
  aimedjobseek-test-pg:
    name: aimedjobseek-test-pg
